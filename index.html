<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FaceFlow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08080c;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 22px;
      font-size: 30px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: auto;
    }

    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #15151c;
      border-radius: 18px;
      overflow: hidden;
    }

    video,
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      left: 0;
      top: 0;
    }

    canvas {
      pointer-events: none;
    }

    input {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: #15151c;
      color: white;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .start {
      background: white;
      color: black;
    }

    .swap {
      background: #6c4cff;
      color: white;
    }

    .stop {
      background: #292932;
      color: white;
    }

    #status {
      text-align: center;
      margin: 18px 0;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>FaceFlow</header>

<div class="container">

  <div class="camera-box">

    <video id="camera" autoplay playsinline></video>

    <canvas id="overlay"></canvas>

  </div>

  <input
    id="faceInput"
    type="file"
    accept="image/*"
  >

  <button class="start" onclick="startCamera()">
    Start Camera
  </button>

  <button class="swap" onclick="startFaceTracking()">
    Start Face Tracking
  </button>

  <button class="stop" onclick="stopCamera()">
    Stop
  </button>

  <div id="status">
    Loading FaceFlow...
  </div>

</div>

<script type="module">

  import {
    FaceLandmarker,
    FilesetResolver
  } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

  const video = document.getElementById("camera");
  const canvas = document.getElementById("overlay");
  const ctx = canvas.getContext("2d");
  const status = document.getElementById("status");

  let stream = null;
  let faceLandmarker = null;
  let tracking = false;

  async function loadFaceAI() {

    try {

      status.innerText = "Loading face AI...";

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
          },

          runningMode: "VIDEO",

          numFaces: 1
        }
      );

      status.innerText = "Face AI ready";

    } catch (error) {

      console.error(error);

      status.innerText =
        "Face AI could not load";

    }
  }

  window.startCamera = async function() {

    try {

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });

      video.srcObject = stream;

      await video.play();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      status.innerText =
        "Camera running";

    } catch (error) {

      console.error(error);

      status.innerText =
        "Camera permission denied";

    }
  };

  window.startFaceTracking = function() {

    if (!faceLandmarker) {

      status.innerText =
        "Face AI is still loading";

      return;
    }

    if (!stream) {

      status.innerText =
        "Start the camera first";

      return;
    }

    tracking = true;

    status.innerText =
      "Looking for your face...";

    detectFace();

  };

  async function detectFace() {

    if (!tracking) return;

    if (video.readyState >= 2) {

      const now = performance.now();

      const results =
        faceLandmarker.detectForVideo(
          video,
          now
        );

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      if (
        results.faceLandmarks &&
        results.faceLandmarks.length > 0
      ) {

        status.innerText =
          "Face detected ✓";

        const landmarks =
          results.faceLandmarks[0];

        ctx.fillStyle = "#ffffff";

        for (let i = 0; i < landmarks.length; i += 8) {

          const point = landmarks[i];

          const x =
            point.x * canvas.width;

          const y =
            point.y * canvas.height;

          ctx.beginPath();

          ctx.arc(
            x,
            y,
            2,
            0,
            Math.PI * 2
          );

          ctx.fill();
        }

      } else {

        status.innerText =
          "Looking for your face...";

      }
    }

    requestAnimationFrame(detectFace);

  }

  window.stopCamera = function() {

    tracking = false;

    if (stream) {

      stream.getTracks().forEach(
        track => track.stop()
      );

      stream = null;
    }

    video.srcObject = null;

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    status.innerText =
      "Camera stopped";

  };

  loadFaceAI();

</script>

</body>
</html>
