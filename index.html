<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FaceFlow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08080c;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      width: 94%;
      max-width: 900px;
      margin: auto;
    }

    .views {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .panel,
    .avatar-section {
      background: #121219;
      padding: 14px;
      border-radius: 18px;
    }

    .title {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050507;
      border-radius: 14px;
      overflow: hidden;
    }

    video,
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-section {
      margin-top: 20px;
      text-align: center;
    }

    .avatar-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 14px;
    }

      width: 100%;
      padding: 13px;
      background: #1c1c25;
      color: white;
      border-radius: 10px;
      border: 1px solid #33333d;
    }
