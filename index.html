<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FaceFlow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08080c;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      width: 94%;
      max-width: 900px;
      margin: auto;
    }

    .views {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .panel {
      background: #121219;
      padding: 10px;
      border-radius: 18px;
    }

    .title {
      font-size: 14px;
      color: #aaa;
      margin: 4px 4px 10px;
    }

    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050507;
      border-radius: 14px;
      overflow: hidden;
    }

    video,
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .start {
      background: white;
      color: black;
    }

    .swap {
      background: #6c4cff;
      color: white;
    }

    .fullscreen {
      background: #24242d;
      color: white;
    }

    .stop {
      background: #24242d;
      color: white;
    }

    .avatar-section {
      background: #121219;
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
    }

    .avatar-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #avatarPreview {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      display: none;
      margin: 15px auto;
      border: 3px solid #6c4cff;
    }

    #avatarInput {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: #1c1c25;
      color: white;
    }

    .remove {
      background: #292932;
      color: white;
      display: none;
    }

    #status {
      text-align: center;
      color: #aaa;
      padding: 16px 0;
    }

    @media (min-width: 700px) {
      .views {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<header>FaceFlow</header>

<div class="container">

  <!-- INPUT AND OUTPUT -->

  <div class="views">

    <div class="panel">

      <div class="title">
        INPUT CAMERA
      </div>

      <div class="screen">

        <video
          id="inputVideo"
          autoplay
          playsinline
          muted>
        </video>

      </div>

    </div>


    <div class="panel">

      <div class="title">
        OUTPUT
      </div>

      <div
        class="screen"
        id="outputScreen">

        <canvas id="outputCanvas"></canvas>

      </div>

      <button
        class="fullscreen"
        onclick="fullscreenOutput()">

        Full Screen Output

      </button>

    </div>

  </div>


  <!-- AVATAR -->

  <div class="avatar-section">

    <div class="avatar-title">
      Choose Avatar
    </div>

    <input
      id="avatarInput"
      type="file"
      accept="image/*">

    <img
      id="avatarPreview"
      alt="Selected Avatar">

    <button
      id="removeAvatar"
      class="remove"
      onclick="removeAvatar()">

      Remove Avatar

    </button>

  </div>


  <!-- CONTROLS -->

  <button
    class="start"
    onclick="startCamera()">

    Start Camera

  </button>


  <button
    class="swap"
    onclick="startFaceSwap()">

    Start Face Swap

  </button>


  <button
    class="stop"
    onclick="stopCamera()">

    Stop

  </button>


  <div id="status">
    Ready
  </div>

</div>

  const outputScreen =
