<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FaceFlow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08080c;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      width: 94%;
      max-width: 900px;
      margin: auto;
    }

    .views {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .panel,
    .avatar-section {
      background: #121219;
      padding: 14px;
      border-radius: 18px;
    }

    .title {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050507;
      border-radius: 14px;
      overflow: hidden;
    }

    video,
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #inputVideo {
      transform: scaleX(-1);
    }

    .avatar-section {
      margin-top: 20px;
      text-align: center;
    }

    .avatar-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    #avatarInput {
      width: 100%;
      padding: 13px;
      background: #1c1c25;
      color: white;
      border-radius: 10px;
      border: 1px solid #33333d;
    }

    #avatarPreviewBox {
      display: none;
      margin-top: 18px;
      padding: 16px;
      background: #1c1c25;
      border-radius: 15px;
    }

    #avatarStatus {
      font-weight: bold;
      margin-bottom: 12px;
    }

    #avatarPreview {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      margin: auto;
    }

    #avatarName {
      margin-top: 12px;
      color: #aaa;
      word-break: break-word;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .start {
      background: white;
      color: black;
    }

    .swap {
      background: #6c4cff;
      color: white;
    }

    .fullscreen,
    .stop,
    .remove {
      background: #292932;
      color: white;
    }

    #status {
      text-align: center;
      color: #aaa;
      padding: 16px 0;
    }

    @media (min-width: 700px) {
      .views {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<header>FaceFlow</header>

<div class="container">

  <!-- CAMERA VIEWS -->

  <div class="views">

    <div class="panel">

      <div class="title">
        INPUT CAMERA
      </div>

      <div class="screen">

        <video
          id="inputVideo"
          autoplay
          playsinline
          muted>
        </video>

      </div>

    </div>


    <div class="panel">

      <div class="title">
        OUTPUT
      </div>

      <div
        class="screen"
        id="outputScreen">

        <canvas id="outputCanvas"></canvas>

      </div>

      <button
        class="fullscreen"
        onclick="fullscreenOutput()">

        Full Screen Output

      </button>

    </div>

  </div>


  <!-- AVATAR -->

  <div class="avatar-section">

    <div class="avatar-title">
      Choose Avatar
    </div>

    <input
      id="avatarInput"
      type="file"
      accept="image/*">

    <div id="avatarPreviewBox">

      <div id="avatarStatus">
        Avatar Selected ✓
      </div>

      <img
        id="avatarPreview"
        alt="Selected Avatar">

      <div id="avatarName"></div>

      <button
        class="remove"
        onclick="removeAvatar()">

        Remove Avatar

      </button>

    </div>

  </div>


  <!-- CONTROLS -->

  <button
    class="start"
    onclick="startCamera()">

    Start Camera

  </button>


  <button
    class="swap"
    onclick="startFaceSwap()">

    Start Face Swap

  </button>


  <button
    class="stop"
    onclick="stopCamera()">

    Stop

  </button>


  <div id="status">
    Ready
  </div>

</div>


<script type="module">

  import {
    FaceDetector,
    FilesetResolver
  } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


  let stream = null;
  let detector = null;
  let detecting = false;
  let lastVideoTime = -1;


  const inputVideo =
    document.getElementById("inputVideo");

  const outputCanvas =
    document.getElementById("outputCanvas");

  const outputScreen =
    document.getElementById("outputScreen");

  const avatarInput =
    document.getElementById("avatarInput");

  const avatarPreview =
    document.getElementById("avatarPreview");

  const avatarPreviewBox =
    document.getElementById("avatarPreviewBox");

  const avatarName =
    document.getElementById("avatarName");

  const ctx =
    outputCanvas.getContext("2d");

  const status =
    document.getElementById("status");


  /*
    LOAD FACE DETECTOR
  */

  async function loadDetector() {

    try {

      status.innerText =
        "Preparing face detection...";

      const vision =
        await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );


      detector =
        await FaceDetector.createFromOptions(
          vision,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
            },

            runningMode: "VIDEO",

            minDetectionConfidence: 0.5
          }
        );


      status.innerText =
        "Face detection ready ✓";

    }

    catch (error) {

      console.error(error);

      status.innerText =
        "Face detection could not load";

    }

  }


  /*
    START CAMERA
  */

  window.startCamera =
    async function() {

      try {

        status.innerText =
          "Requesting camera...";


        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: "user"
            },

            audio: false

          });


        inputVideo.srcObject =
          stream;


        await inputVideo.play();


        resizeCanvas();


        status.innerText =
          "Camera running";


      }

      catch (error) {

        console.error(error);

        status.innerText =
          "Camera permission was denied";

      }

    };


  /*
    RESIZE OUTPUT
  */

  function resizeCanvas() {

    if (!inputVideo.videoWidth) return;

    outputCanvas.width =
      inputVideo.videoWidth;

    outputCanvas.height =
      inputVideo.videoHeight;

  }


  /*
    FACE DETECTION
  */

  window.startFaceSwap =
    function() {

      if (!stream) {

        status.innerText =
          "Start the camera first";

        return;

      }


      if (!detector) {

        status.innerText =
          "Face detector is not ready";

        return;

      }


      detecting = true;

      status.innerText =
        "Looking for your face...";


      detectFace();

    };


  async function detectFace() {

    if (!detecting) return;


    resizeCanvas();


    /*
      Draw the camera into the output.
    */

    ctx.save();

    ctx.scale(-1, 1);

    ctx.drawImage(
      inputVideo,
      -outputCanvas.width,
      0,
      outputCanvas.width,
      outputCanvas.height
    );

    ctx.restore();


    /*
      Detect face.
    */

    if (
      inputVideo.readyState >= 2 &&
      inputVideo.currentTime !== lastVideoTime
    ) {

      lastVideoTime =
        inputVideo.currentTime;


      const results =
        detector.detectForVideo(
          inputVideo,
          performance.now()
        );


      if (
        results.detections &&
        results.detections.length > 0
      ) {

        status.innerText =
          "Face detected ✓";


        const box =
          results.detections[0].boundingBox;


        /*
          Mirror the detection
          because the camera preview
          is mirrored.
        */

        const x =
          outputCanvas.width -
          (box.originX + box.width);


        const y =
          box.originY;


        const width =
          box.width;


        const height =
          box.height;


        /*
          Draw detection box.
        */

        ctx.strokeStyle =
          "#ffffff";

        ctx.lineWidth =
          4;


        ctx.strokeRect(
          x,
          y,
          width,
          height
        );

      }

      else {

        status.innerText =
          "Looking for your face...";

      }

    }


    requestAnimationFrame(
      detectFace
    );

  }


  /*
    AVATAR
  */

  avatarInput.addEventListener(
    "change",
    function() {

      const file =
        this.files[0];

      if (!file) return;


      const imageURL =
        URL.createObjectURL(file);


      avatarPreview.src =
        imageURL;


      avatarPreviewBox.style.display =
        "block";


      avatarName.innerText =
        file.name;


      status.innerText =
        "Avatar selected ✓";

    }
  );


  window.removeAvatar =
    function() {

      avatarInput.value =
        "";


      avatarPreview.src =
        "";


      avatarPreviewBox.style.display =
        "none";


      avatarName.innerText =
        "";


      status.innerText =
        "Avatar removed";

    };


  /*
    STOP
  */

  window.stopCamera =
    function() {

      detecting = false;


      if (stream) {

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );


        stream = null;

      }


      inputVideo.srcObject =
        null;


      ctx.clearRect(
        0,
        0,
        outputCanvas.width,
        outputCanvas.height
      );


      status.innerText =
        "Camera stopped";

    };


  /*
    FULL SCREEN
  */

  window.fullscreenOutput =
    function() {

      if (
        outputScreen.requestFullscreen
      ) {

        outputScreen.requestFullscreen();

      }

    };


  /*
    START LOADING THE DETECTOR
  */

  status.innerText = "FaceFlow AI is starting...";

loadDetector();

</script>

</body>
</html>
