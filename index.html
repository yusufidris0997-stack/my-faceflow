<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FaceFlow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08080c;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      width: 94%;
      max-width: 900px;
      margin: auto;
    }

    .views {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .panel {
      background: #121219;
      padding: 10px;
      border-radius: 18px;
    }

    .title {
      font-size: 14px;
      color: #aaa;
      margin: 4px 4px 10px;
    }

    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050507;
      border-radius: 14px;
      overflow: hidden;
    }

    video,
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #outputCanvas {
      display: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .start {
      background: white;
      color: black;
    }

    .swap {
      background: #6c4cff;
      color: white;
    }

    .fullscreen {
      background: #24242d;
      color: white;
    }

    .stop {
      background: #24242d;
      color: white;
    }

    #status {
      text-align: center;
      color: #aaa;
      padding: 16px 0;
    }

    @media (min-width: 700px) {
      .views {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<header>FaceFlow</header>

<div class="container">

  <div class="views">

    <!-- INPUT CAMERA -->

    <div class="panel">

      <div class="title">
        INPUT CAMERA
      </div>

      <div class="screen">
        <video
          id="inputVideo"
          autoplay
          playsinline
          muted>
        </video>
      </div>

    </div>


    <!-- OUTPUT CAMERA -->

    <div class="panel">

      <div class="title">
        OUTPUT
      </div>

      <div
        class="screen"
        id="outputScreen">

        <canvas id="outputCanvas"></canvas>

      </div>

      <button
        class="fullscreen"
        onclick="fullscreenOutput()">

        Full Screen Output

      </button>

    </div>

  </div>


  <button
    class="start"
    onclick="startCamera()">

    Start Camera

  </button>


  <button
    class="swap"
    onclick="startFaceSwap()">

    Start Face Swap

  </button>


  <button
    class="stop"
    onclick="stopCamera()">

    Stop

  </button>


  <div id="status">
    Ready
  </div>

</div>


<script>

  let stream = null;

  const inputVideo =
    document.getElementById("inputVideo");

  const outputCanvas =
    document.getElementById("outputCanvas");

  const outputScreen =
    document.getElementById("outputScreen");

  const ctx =
    outputCanvas.getContext("2d");

  const status =
    document.getElementById("status");


  async function startCamera() {

    try {

      status.innerText =
        "Requesting camera...";

      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: "user"
          },

          audio: false

        });

      inputVideo.srcObject =
        stream;

      await inputVideo.play();

      outputCanvas.style.display =
        "block";

      resizeOutput();

      mirrorCamera();

      status.innerText =
        "Camera running";

    }

    catch (error) {

      console.error(error);

      status.innerText =
        "Camera permission was denied";

    }

  }


  function resizeOutput() {

    if (!inputVideo.videoWidth) return;

    outputCanvas.width =
      inputVideo.videoWidth;

    outputCanvas.height =
      inputVideo.videoHeight;

  }


  function mirrorCamera() {

    if (!stream) return;

    resizeOutput();

    ctx.save();

    ctx.scale(-1, 1);

    ctx.drawImage(
      inputVideo,
      -outputCanvas.width,
      0,
      outputCanvas.width,
      outputCanvas.height
    );

    ctx.restore();

    requestAnimationFrame(
      mirrorCamera
    );

  }


  function startFaceSwap() {

    if (!stream) {

      status.innerText =
        "Start the camera first";

      return;

    }

    status.innerText =
      "Face-swap engine will be connected here";

  }


  function stopCamera() {

    if (stream) {

      stream
        .getTracks()
        .forEach(track =>
          track.stop()
        );

      stream = null;

    }

    inputVideo.srcObject =
      null;

    ctx.clearRect(
      0,
      0,
      outputCanvas.width,
      outputCanvas.height
    );

    status.innerText =
      "Camera stopped";

  }


  function fullscreenOutput() {

    if (
      outputScreen.requestFullscreen
    ) {

      outputScreen.requestFullscreen();

    }

  }

</script>

</body>
</html>
